<ul class="message-list">
  <li class="message-item" *ngFor="let m of messages">
    
    <!-- Conteúdo da mensagem -->
    <div class="message-content">
      {{ m.content }}
      <img *ngIf="m.imagePath" [src]="baseUrl + m.imagePath" class="message-image" alt="Imagem da mensagem" />
    </div>

    <!-- Metadados da mensagem -->
    <div class="message-meta">
      <img *ngIf="m.author.avatarUrl; else placeholder" [src]="baseUrl + m.author.avatarUrl"
        alt="Avatar de {{ m.author.username }}" class="avatar" />

      <ng-template #placeholder>
        <img src="assets/default-user.png" alt="Avatar padrão" class="avatar" />
      </ng-template>

      <strong class="username">{{ m.author.username }}</strong>
      <small class="timestamp">{{ m.createdAt | date:'short' }}</small>

      <button class="action-btn" (click)="editMessage(m)">✏️ Editar</button>
      <button class="action-btn danger" (click)="deleteMessage(m._id)">🗑️ Apagar</button>
    </div>

    <!-- Reações: AGORA NO FINAL -->
    <div class="reactions">
      <button (click)="reagir(m._id, '👍')">👍 {{ getReactionCount(m.reactions, '👍') }}</button>
      <button (click)="reagir(m._id, '❤️')">❤️ {{ getReactionCount(m.reactions, '❤️') }}</button>
      <button (click)="reagir(m._id, '😂')">😂 {{ getReactionCount(m.reactions, '😂') }}</button>
    </div>

  </li>
</ul>
