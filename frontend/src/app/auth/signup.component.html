<div class="signup-wrapper">
  <div class="signup-card">
    <h2>Crie sua Conta</h2>
    <p class="subtext">Leva menos de um minuto para criar sua conta.</p>

    <form [formGroup]="myForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <div class="input-icon">
          <span class="icon"></span>
          <input type="text" placeholder="Seu nome" formControlName="firstNameTS" />
        </div>
      </div>

      <div class="form-group">
        <div class="input-icon">
          <span class="icon"></span>
          <input type="text" placeholder="Seu sobrenome" formControlName="lastNameTS" />
        </div>
      </div>

      <div class="form-group">
        <div class="input-icon">
          <span class="icon"></span>
          <input type="email" placeholder="exemplo@email.com" formControlName="emailTS" />
        </div>
      </div>

      <div class="form-group">
        <div class="input-icon">
          <span class="icon"></span>
          <input type="password" placeholder="Crie sua senha" formControlName="passwordTS" />
        </div>
      </div>

      <div class="form-group">
        <div class="input-icon">
          <span class="icon">📷</span>
          <input type="file" (change)="onFileSelected($event)" accept="image/*" />
        </div>
      </div>

      <button type="submit" [disabled]="!myForm.valid" class="btn-primary">
        Continuar →
      </button>
    </form>
  </div>
</div>
